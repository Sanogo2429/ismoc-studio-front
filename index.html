<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover : l'interface s'étend sous l'encoche / la barre tactile, les marges sont gérées par env(safe-area-inset-*) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="IsMoc Studio conçoit des sites et applications sur mesure, basé en France et disponible à distance." />
    <title>IsMoc Studio — Des produits digitaux à votre image</title>

    <!-- Application web installable (PWA) -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0B132B" />
    <meta name="application-name" content="IsMoc Studio" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Icônes -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />

    <!-- iOS : « Ajouter à l'écran d'accueil » en plein écran -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="IsMoc Studio" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Écran de démarrage (mobile) : dans le HTML pour s'afficher dès la première image, avant le chargement
         de l'application. Retiré par src/services/splash.ts après ~1,5 s, en fondu. -->
    <style>
      #splash { position: fixed; inset: 0; z-index: 2147483647; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 34px; background: radial-gradient(120% 80% at 50% 38%, #18234a 0%, #0B132B 62%); color: #fff; transition: opacity .5s ease, visibility .5s ease; }
      #splash.is-hidden { opacity: 0; visibility: hidden; }
      .splash-mark { position: relative; width: 88px; height: 88px; display: flex; align-items: center; justify-content: center; border-radius: 26px; background: #fff; color: #0B132B; font: 800 32px/1 'Manrope', ui-sans-serif, system-ui, -apple-system, sans-serif; letter-spacing: -.5px; box-shadow: 0 24px 60px rgba(245, 158, 11, .22); animation: splash-in .9s cubic-bezier(.16, 1, .3, 1) both; }
      .splash-mark::after { content: ''; position: absolute; inset: -10px; border: 2px solid rgba(245, 158, 11, .55); border-radius: 34px; opacity: 0; animation: splash-ring 1.4s cubic-bezier(.16, 1, .3, 1) .35s both; }
      .splash-slash { display: inline-block; margin: 0 2px; color: #F59E0B; animation: splash-tilt 1s ease .45s both; }
      .splash-name { text-align: center; font: 700 19px/1 'Manrope', ui-sans-serif, system-ui, -apple-system, sans-serif; animation: splash-rise .8s ease .4s both; }
      .splash-name small { display: block; margin-top: 7px; color: rgba(255, 255, 255, .72); font-size: 9px; font-weight: 700; letter-spacing: .38em; }
      @keyframes splash-in { from { opacity: 0; transform: scale(.62); } to { opacity: 1; transform: scale(1); } }
      @keyframes splash-ring { 0% { opacity: 0; transform: scale(.85); } 40% { opacity: 1; } 100% { opacity: 0; transform: scale(1.25); } }
      @keyframes splash-tilt { 0% { transform: rotate(0); } 50% { transform: rotate(-14deg); } 100% { transform: rotate(0); } }
      @keyframes splash-rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) {
        .splash-mark, .splash-mark::after, .splash-slash, .splash-name { animation: none; }
        .splash-mark::after { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="splash-mark">I<span class="splash-slash">/</span>M</div>
      <div class="splash-name">IsMoc<small>STUDIO</small></div>
    </div>
    <script>
      // Affiché uniquement sur mobile (écran tactile ou application installée), une fois par session.
      (function () {
        var splash = document.getElementById('splash')
        try {
          var mobile = window.matchMedia('(pointer: coarse)').matches || window.matchMedia('(display-mode: standalone)').matches
          if (!mobile || sessionStorage.getItem('ismoc-splash-shown')) { splash.remove(); return }
          sessionStorage.setItem('ismoc-splash-shown', '1')
          window.__ismocSplashStart = Date.now()
        } catch (error) {
          splash.remove()
        }
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
