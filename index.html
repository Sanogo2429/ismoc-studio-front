<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover : l'interface s'étend sous l'encoche / la barre tactile, les marges sont gérées par env(safe-area-inset-*) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="IsMoc Studio conçoit des sites et applications sur mesure, basé en France et disponible à distance." />
    <title>IsMoc Studio — Des produits digitaux à votre image</title>

    <!-- Application web installable (PWA) -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0B132B" />
    <meta name="application-name" content="IsMoc Studio" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Icônes -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />

    <!-- iOS : « Ajouter à l'écran d'accueil » en plein écran -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="IsMoc Studio" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
